<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner · Bible Class Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A26; --ink-soft:#4A5A55;
    --paper:#F4F6F3; --card:#FFFFFF;
    --deep:#1F4A3F; --mid:#55897A; --light:#A7C6B8;
    --brass:#9A7B2F; --brass-soft:#EFE4C8;
    --rule:#D6DDD7; --rule-soft:#E8EDE9;
    --display:"Fraunces","Iowan Old Style",Palatino,Georgia,serif;
    --body:"Public Sans","Helvetica Neue",Arial,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;}
  .sheet{max-width:1180px;margin:0 auto;padding:0 20px 80px;}

  /* toolbar */
  .toolbar{
    position:sticky;top:0;z-index:20;
    background:var(--ink);color:#fff;
    margin:0 -20px 26px;padding:12px 20px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .toolbar .brand{font-family:var(--display);font-size:19px;font-weight:600;margin-right:auto;}
  .toolbar label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.72;margin-right:6px;}
  input[type=number]{
    font-family:var(--mono);font-size:14px;font-weight:700;width:82px;
    background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.28);
    padding:6px 8px;border-radius:2px;
  }
  button{
    font-family:var(--body);font-size:13px;font-weight:500;
    background:transparent;color:#fff;border:1px solid rgba(255,255,255,.34);
    padding:6px 12px;border-radius:2px;cursor:pointer;
  }
  button:hover{background:rgba(255,255,255,.12);}
  button.warn:hover{background:#7B2B22;border-color:#7B2B22;}
  #status{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;min-width:96px;}
  .viewtabs{display:inline-flex;}
  .viewtabs button{border-radius:0;margin:0;}
  .viewtabs button:first-child{border-right:none;}
  .viewtabs button.on{background:#fff;color:var(--ink);border-color:#fff;font-weight:600;}
  .viewtabs button.on:hover{background:#fff;}

  /* by-class year grid */
  .yearwrap{background:var(--card);border:1px solid var(--rule);overflow-x:auto;}
  table.byclass{border-collapse:collapse;width:100%;min-width:1040px;}
  table.byclass th.rowh,table.byclass td.rowh{
    position:sticky;left:0;z-index:3;background:var(--card);
    border-right:1px solid var(--rule);
    width:172px;min-width:172px;padding:8px 12px;text-align:left;vertical-align:top;
  }
  table.byclass thead th{
    padding:11px 10px 9px;text-align:left;vertical-align:bottom;
    border-bottom:1.5px solid var(--ink);
  }
  table.byclass thead th.rowh{z-index:4;}
  .thTerm{font-family:var(--display);font-size:15px;font-weight:600;display:block;line-height:1.1;}
  .thWk{
    font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.06em;
    color:#fff;background:var(--mid);padding:2px 5px;display:inline-block;margin:3px 0 4px;
  }
  .thWk.w13{background:var(--deep);} .thWk.w4{background:var(--light);color:var(--ink);}
  .thDates{font-family:var(--mono);font-size:10px;color:var(--ink-soft);display:block;line-height:1.35;}
  table.byclass td{
    padding:5px 6px;border-bottom:1px solid var(--rule-soft);
    border-right:1px solid var(--rule-soft);vertical-align:top;
  }
  table.byclass tbody tr:last-child td{border-bottom:none;}
  .yrname{font-size:13.5px;font-weight:600;line-height:1.25;}
  .cellfld{
    width:100%;font-family:var(--body);font-size:13px;padding:6px 7px;
    border:1px solid transparent;background:#F7F9F7;color:var(--ink);border-radius:2px;
  }
  .cellfld:focus{outline:none;border-color:var(--deep);background:#fff;}
  .cellfld::placeholder{color:#B3BEB9;}
  .cellfld.who{margin-top:3px;font-size:12px;background:transparent;border-color:var(--rule-soft);}
  .cellfld.who:focus{background:#fff;}
  td.summerspan{background:#FBF6E9;}
  .spanlab{
    font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:#6E5514;display:block;margin-bottom:3px;
  }
  tr.grpband td{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);background:#F0F3F0;padding:6px 12px;border-right:none;
  }
  tr.grpband td.rowh{background:#F0F3F0;}

  h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0 0 3px;}
  .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 12px;}
  section{margin-bottom:30px;}

  /* class manager */
  details.panel{background:var(--card);border:1px solid var(--rule);}
  details.panel > summary{
    padding:13px 16px;cursor:pointer;list-style:none;
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  }
  details.panel > summary::-webkit-details-marker{display:none;}
  details.panel > summary::before{content:"▸ ";color:var(--brass);}
  details.panel[open] > summary::before{content:"▾ ";}
  .panel-body{padding:4px 16px 18px;border-top:1px solid var(--rule-soft);}
  .clsrow{display:grid;grid-template-columns:1fr 132px 118px 34px;gap:8px;align-items:center;margin-top:8px;}
  .clsrow input[type=text],.clsrow select{
    font-family:var(--body);font-size:14px;padding:7px 9px;
    border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:2px;width:100%;
  }
  .clsrow button{color:var(--ink-soft);border-color:var(--rule);padding:6px 0;}
  .clsrow button:hover{background:#F3E3E0;border-color:#9C4A3C;color:#9C4A3C;}
  .addbtn{margin-top:12px;color:var(--ink);border-color:var(--ink);}
  .addbtn:hover{background:var(--ink);color:#fff;}
  .hint{font-size:12.5px;color:var(--ink-soft);margin:2px 0 10px;}

  /* term card */
  .term{background:var(--card);border:1px solid var(--rule);margin-bottom:16px;}
  .thead{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--rule);}
  .tnum{font-family:var(--display);font-size:23px;font-weight:600;line-height:1;}
  .twk{
    font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;
    color:#fff;background:var(--mid);padding:4px 8px;
  }
  .twk.w13{background:var(--deep);} .twk.w4{background:var(--light);color:var(--ink);}
  .tdates{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);}
  .tdates b{color:var(--ink);font-weight:700;}
  .tflag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:var(--brass-soft);color:#6E5514;padding:4px 8px;}
  .tbody{padding:6px 18px 18px;}

  table.assign{width:100%;border-collapse:collapse;}
  table.assign th{
    text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:500;padding:9px 8px 6px;border-bottom:1px solid var(--rule);
  }
  table.assign td{padding:4px 8px;border-bottom:1px solid var(--rule-soft);vertical-align:middle;}
  table.assign tr:last-child td{border-bottom:none;}
  .cname{font-size:13.5px;font-weight:600;white-space:nowrap;}
  .cday{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);display:block;font-weight:400;}
  .fld{
    width:100%;font-family:var(--body);font-size:14px;padding:7px 9px;
    border:1px solid transparent;background:#F7F9F7;color:var(--ink);border-radius:2px;
  }
  .fld:hover{border-color:var(--rule);}
  .fld:focus{outline:none;border-color:var(--deep);background:#fff;}
  .fld::placeholder{color:#A9B5B0;}
  .grp{background:#F0F3F0;}
  .grp td{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);padding:7px 8px;}

  /* weeks */
  details.weeks{margin-top:14px;border-top:1px solid var(--rule);}
  details.weeks > summary{
    padding:11px 0 0;cursor:pointer;list-style:none;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);
  }
  details.weeks > summary::-webkit-details-marker{display:none;}
  details.weeks > summary::before{content:"▸ ";}
  details.weeks[open] > summary::before{content:"▾ ";}
  .scroller{overflow-x:auto;margin-top:12px;}
  table.wk{border-collapse:collapse;font-size:13px;min-width:100%;}
  table.wk th{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:500;text-align:left;padding:7px 8px;
    border-bottom:1px solid var(--rule);white-space:nowrap;
  }
  table.wk td{padding:3px 4px;border-bottom:1px solid var(--rule-soft);}
  table.wk td:first-child,table.wk th:first-child{
    position:sticky;left:0;background:var(--card);z-index:2;padding-left:0;padding-right:12px;
  }
  .wdate{font-family:var(--mono);font-size:12px;font-weight:700;white-space:nowrap;}
  .wnum{font-family:var(--mono);font-size:10px;color:var(--ink-soft);font-weight:400;}
  .wfld{
    width:190px;font-family:var(--body);font-size:13px;padding:6px 8px;
    border:1px solid transparent;background:#F7F9F7;border-radius:2px;color:var(--ink);
  }
  .wfld:focus{outline:none;border-color:var(--deep);background:#fff;}
  .daylabel{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);margin:16px 0 2px;
  }
  .seriesbox{background:var(--brass-soft);padding:10px 14px;margin-top:12px;font-size:13px;}
  .seriesbox b{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:3px;color:#6E5514;}

  .tnotes{width:100%;font-family:var(--body);font-size:13.5px;padding:8px 10px;border:1px solid var(--rule-soft);background:#F7F9F7;border-radius:2px;resize:vertical;min-height:44px;margin-top:14px;color:var(--ink);}
  .tnotes:focus{outline:none;border-color:var(--deep);background:#fff;}


  .navwrap{max-width:1180px;margin:0 auto;padding:0 20px;}
  /* site nav */
  .sitenav{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:16px 0 13px;border-bottom:1px solid var(--rule);margin-bottom:0;}
  .sitenav .brandlink{font-family:var(--display);font-size:15px;font-weight:600;color:var(--ink);text-decoration:none;margin-right:auto;letter-spacing:-.01em;}
  .sitenav .brandlink:hover{color:var(--brass);}
  .sitenav a.nl{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);text-decoration:none;padding-bottom:3px;border-bottom:2px solid transparent;}
  .sitenav a.nl:hover{color:var(--ink);}
  .sitenav a.nl.on{color:var(--ink);border-bottom-color:var(--brass);}
  @media print{.sitenav,.navwrap{display:none !important;}}

  @media print{
    @page{size:letter portrait;margin:.45in;}
    body{background:#fff;font-size:9.5pt;}
    .toolbar,.panel,.addbtn,details.weeks > summary{display:none !important;}
    .sheet{max-width:none;padding:0;}
    .term{break-inside:avoid;border-color:#bbb;}
    .fld,.wfld,.tnotes,.cellfld{background:#fff;border-color:#ddd;}
    @page{size:letter landscape;}
    .yearwrap{overflow:visible;border-color:#bbb;break-inside:avoid;}
    table.byclass{min-width:0;font-size:8.5pt;}
    table.byclass th.rowh,table.byclass td.rowh{position:static;}
    details.weeks[open] > summary{display:none;}
  }
</style>
</head>
<body>

<div class="navwrap">
  <nav class="sitenav">
    <a class="brandlink" href="index.html">Bible Class Calendar</a>
    <a class="nl" href="index.html">Home</a>
    <a class="nl" href="cal-structure.html">Structure</a>
    <a class="nl on" href="cal-plan.html">Planner</a>
  </nav>
</div>

<div class="toolbar">
  <span class="brand">Planner</span>
  <span><label for="year">Year</label><input type="number" id="year" min="2024" max="2060" step="1"></span>
  <span id="status">Ready</span>
  <span class="viewtabs">
    <button id="btnByClass" class="on">By class</button><button id="btnByTerm">By term</button>
  </span>
  <button id="btnExport">Export</button>
  <button id="btnImport">Import</button>
  <button id="btnPrint">Print</button>
  <button id="btnReset" class="warn">Reset</button>
  <input type="file" id="fileIn" accept="application/json" hidden>
</div>

<div class="sheet">

  <section>
    <details class="panel" id="clsPanel">
      <summary>Classes &amp; rooms</summary>
      <div class="panel-body">
        <p class="hint">Rename these to match your age bands. "Day" controls which terms and which weeks a class shows up in.</p>
        <div id="clsList"></div>
        <button class="addbtn" id="btnAddClass">+ Add a class</button>
      </div>
    </details>
  </section>

  <section id="terms"></section>

</div>

<script>
(function(){
  "use strict";

  var SUN_LEN = [13,9,4,9,13,4];
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var KEY = "biblecal:v1";

  function defaultState(){
    return {
      year: 2027,
      view: "class",
      classes: [
        {id:"c1", name:"Adult 1",           day:"sun",  group:"Adult"},
        {id:"c2", name:"Adult 2",           day:"sun",  group:"Adult"},
        {id:"c3", name:"Adult",             day:"wed",  group:"Adult"},
        {id:"c4", name:"High School",       day:"sun",  group:"Youth"},
        {id:"c5", name:"Middle School",     day:"both", group:"Youth"},
        {id:"c6", name:"Upper Elementary",  day:"both", group:"Youth"},
        {id:"c7", name:"Lower Elementary",  day:"both", group:"Youth"},
        {id:"c8", name:"Cradle Roll",       day:"sun",  group:"Other"}
      ],
      terms: {}
    };
  }

  var state = defaultState();
  var seq = 100;

  /* ---------- dates ---------- */
  function sundaysIn(year){
    var d = new Date(year,0,1);
    while(d.getDay() !== 0){ d.setDate(d.getDate()+1); }
    var out = [];
    while(d.getFullYear() === year){
      out.push(new Date(d));
      d.setDate(d.getDate()+7);
    }
    return out;
  }
  function plus(d,n){ var x = new Date(d); x.setDate(x.getDate()+n); return x; }
  function fmt(d){ return MON[d.getMonth()] + " " + d.getDate(); }
  function fmtY(d){ return MON[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); }

  function buildTerms(year){
    var suns = sundaysIn(year);
    var lens = SUN_LEN.slice();
    var extra = suns.length - 52;
    if(extra > 0){ lens[5] += extra; }
    var terms = [], i = 0;
    for(var t=0; t<lens.length; t++){
      var weeks = [];
      for(var w=0; w<lens[t]; w++){
        var s = suns[i+w];
        weeks.push({ sun:s, wed:plus(s,3) });
      }
      terms.push({ idx:t, len:lens[t], weeks:weeks, extra:(t===5 && extra>0) ? extra : 0 });
      i += lens[t];
    }
    return terms;
  }

  /* ---------- state helpers ---------- */
  function term(t){
    if(!state.terms[t]) state.terms[t] = { assign:{}, weeks:{}, notes:"" };
    return state.terms[t];
  }
  function assign(t, cid){
    var T = term(t);
    if(!T.assign[cid]) T.assign[cid] = { topic:"", teacher:"" };
    return T.assign[cid];
  }
  function weekVal(t, w, cid){
    var T = term(t);
    return (T.weeks[w] && T.weeks[w][cid]) || "";
  }
  function setWeek(t, w, cid, v){
    var T = term(t);
    if(!T.weeks[w]) T.weeks[w] = {};
    T.weeks[w][cid] = v;
  }
  function meets(c, day){ return c.day === day || c.day === "both"; }
  function isSummerWed(t){ return t === 2 || t === 3; }

  /* ---------- persistence ---------- */
  var saveTimer = null, statusEl = null;
  function setStatus(msg){
    if(!statusEl) statusEl = document.getElementById("status");
    statusEl.textContent = msg;
  }
  function save(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      var payload = JSON.stringify(state);
      if(window.storage && window.storage.set){
        window.storage.set(KEY, payload).then(function(){
          setStatus("Saved " + new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}));
        })["catch"](function(){ setStatus("Unsaved — export"); });
      } else {
        setStatus("Unsaved — export");
      }
    }, 500);
  }
  function load(done){
    if(window.storage && window.storage.get){
      window.storage.get(KEY).then(function(r){
        if(r && r.value){
          try { state = JSON.parse(r.value); setStatus("Loaded"); } catch(e){}
        }
        done();
      })["catch"](function(){ done(); });
    } else { done(); }
  }

  /* ---------- render ---------- */
  function el(tag, cls, txt){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(txt !== undefined) n.textContent = txt;
    return n;
  }
  function field(cls, val, ph, onInput){
    var i = document.createElement("input");
    i.type = "text"; i.className = cls; i.value = val || ""; i.placeholder = ph || "";
    i.addEventListener("input", function(){ onInput(i.value); save(); });
    return i;
  }

  function renderClasses(){
    var host = document.getElementById("clsList");
    host.innerHTML = "";
    state.classes.forEach(function(c, ix){
      var row = el("div","clsrow");

      var nm = document.createElement("input");
      nm.type = "text"; nm.value = c.name; nm.placeholder = "Class name";
      nm.addEventListener("input", function(){ c.name = nm.value; save(); paintNames(c.id, nm.value); });
      row.appendChild(nm);

      var dsel = document.createElement("select");
      [["sun","Sunday only"],["wed","Wednesday only"],["both","Both days"]].forEach(function(o){
        var op = document.createElement("option"); op.value = o[0]; op.textContent = o[1];
        if(c.day === o[0]) op.selected = true;
        dsel.appendChild(op);
      });
      dsel.addEventListener("change", function(){ c.day = dsel.value; save(); renderView(); });
      row.appendChild(dsel);

      var gsel = document.createElement("select");
      ["Adult","Youth","Other"].forEach(function(g){
        var op = document.createElement("option"); op.value = g; op.textContent = g;
        if(c.group === g) op.selected = true;
        gsel.appendChild(op);
      });
      gsel.addEventListener("change", function(){ c.group = gsel.value; save(); renderView(); });
      row.appendChild(gsel);

      var rm = el("button", null, "✕");
      rm.title = "Remove this class";
      rm.addEventListener("click", function(){
        if(!confirm("Remove " + c.name + "? Anything entered for it is deleted.")) return;
        state.classes.splice(ix,1); save(); renderClasses(); renderView();
      });
      row.appendChild(rm);

      host.appendChild(row);
    });
  }
  function paintNames(cid, val){
    var nodes = document.querySelectorAll('[data-name="'+cid+'"]');
    for(var i=0;i<nodes.length;i++){ nodes[i].firstChild.nodeValue = val; }
  }

  function renderView(){
    var tabs = [["btnByClass","class"],["btnByTerm","term"]];
    tabs.forEach(function(p){
      var b = document.getElementById(p[0]);
      if(b) b.className = (state.view === p[1]) ? "on" : "";
    });
    if(state.view === "term") renderTerms(); else renderByClass();
  }

  function renderByClass(){
    var host = document.getElementById("terms");
    host.innerHTML = "";
    var terms = buildTerms(state.year);

    var head = el("div");
    head.appendChild(el("h2", null, state.year + " at a glance"));
    head.appendChild(el("p", "sub", "Rows are classes · columns are terms · everything here is editable"));
    host.appendChild(head);

    var wrap = el("div","yearwrap");
    var tbl = el("table","byclass");

    var thead = document.createElement("thead");
    var hr = document.createElement("tr");
    hr.appendChild(el("th","rowh","Class"));
    terms.forEach(function(T){
      var th = document.createElement("th");
      th.appendChild(el("span","thTerm","Term " + (T.idx+1)));
      th.appendChild(el("span","thWk" + (T.len>=13?" w13":(T.len<=4?" w4":"")), T.len + " wks"));
      var d = el("span","thDates", fmt(T.weeks[0].sun) + " – " + fmt(T.weeks[T.weeks.length-1].sun));
      th.appendChild(d);
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    tbl.appendChild(thead);

    var tb = document.createElement("tbody");
    var lastGroup = null;

    state.classes.forEach(function(c){
      if(c.group !== lastGroup){
        var band = el("tr","grpband");
        var bd = document.createElement("td");
        bd.className = "rowh"; bd.textContent = c.group;
        band.appendChild(bd);
        var bd2 = document.createElement("td");
        bd2.colSpan = 6; bd2.textContent = "";
        band.appendChild(bd2);
        tb.appendChild(band);
        lastGroup = c.group;
      }

      var tr = document.createElement("tr");
      var nameCell = document.createElement("td");
      nameCell.className = "rowh";
      nameCell.setAttribute("data-name", c.id);
      var nm = el("div","yrname");
      nm.appendChild(document.createTextNode(c.name));
      nameCell.appendChild(nm);
      nameCell.appendChild(el("span","cday", c.day === "both" ? "Sun + Wed" : (c.day === "sun" ? "Sunday" : "Wednesday")));
      tr.appendChild(nameCell);

      var wedOnly = (c.day === "wed");
      for(var t=0; t<6; t++){
        if(wedOnly && t === 3) continue;

        var td = document.createElement("td");
        var merged = wedOnly && t === 2;
        if(merged){
          td.colSpan = 2;
          td.className = "summerspan";
          var lab = el("span","spanlab","Summer series · " +
            fmt(terms[2].weeks[0].wed) + " – " + fmt(terms[3].weeks[terms[3].weeks.length-1].wed) + " · 13 wks");
          td.appendChild(lab);
        }
        (function(ti){
          var a = assign(ti, c.id);
          td.appendChild(field("cellfld", a.topic, merged ? "Series theme" : "Study or topic", function(v){ a.topic = v; }));
          td.appendChild(field("cellfld who", a.teacher, merged ? "Coordinator" : "Teacher", function(v){ a.teacher = v; }));
        })(t);
        tr.appendChild(td);
      }
      tb.appendChild(tr);
    });

    tbl.appendChild(tb);
    wrap.appendChild(tbl);
    host.appendChild(wrap);

    var foot = el("p","hint","Wednesday-only classes show one merged cell across Terms 3 and 4, because Wednesday runs the summer series as a single block. Switch to By term for term notes and the week-by-week grids.");
    foot.style.marginTop = "12px";
    host.appendChild(foot);
  }

  function renderTerms(){
    var host = document.getElementById("terms");
    host.innerHTML = "";
    var terms = buildTerms(state.year);

    terms.forEach(function(T){
      var t = T.idx;
      var card = el("div","term");

      /* header */
      var head = el("div","thead");
      head.appendChild(el("span","tnum","Term " + (t+1)));
      var wk = el("span","twk" + (T.len>=13?" w13":(T.len<=4?" w4":"")), T.len + " weeks");
      head.appendChild(wk);

      var first = T.weeks[0], last = T.weeks[T.weeks.length-1];
      var dl = el("span","tdates");
      dl.innerHTML = "<b>Sun</b> " + fmt(first.sun) + " – " + fmt(last.sun) +
                     "  ·  <b>Wed</b> " + fmt(first.wed) + " – " + fmt(last.wed);
      head.appendChild(dl);

      if(t === 3) head.appendChild(el("span","tflag","Promotion ends this term"));
      if(isSummerWed(t)) head.appendChild(el("span","tflag","Wed: summer series"));
      if(T.extra) head.appendChild(el("span","tflag", T.extra + " extra week this year"));
      card.appendChild(head);

      var body = el("div","tbody");

      /* assignment table */
      var tbl = el("table","assign");
      var thead = document.createElement("thead");
      thead.innerHTML = "<tr><th style='width:190px'>Class</th><th>Study or topic</th><th style='width:220px'>Teacher</th></tr>";
      tbl.appendChild(thead);
      var tb = document.createElement("tbody");

      var lastGroup = null;
      state.classes.forEach(function(c){
        if(c.group !== lastGroup){
          var g = el("tr","grp");
          var gd = document.createElement("td"); gd.colSpan = 3; gd.textContent = c.group;
          g.appendChild(gd); tb.appendChild(g);
          lastGroup = c.group;
        }
        var a = assign(t, c.id);
        var tr = document.createElement("tr");

        var td1 = document.createElement("td");
        td1.className = "cname";
        td1.setAttribute("data-name", c.id);
        td1.appendChild(document.createTextNode(c.name));
        var dayTxt = c.day === "both" ? "Sun + Wed" : (c.day === "sun" ? "Sunday" : "Wednesday");
        if(isSummerWed(t) && c.day === "wed") dayTxt += " · in series block";
        td1.appendChild(el("span","cday",dayTxt));
        tr.appendChild(td1);

        var td2 = document.createElement("td");
        td2.appendChild(field("fld", a.topic, isSummerWed(t) && c.day !== "sun" ? "Series theme, or study" : "What is being taught", function(v){ a.topic = v; }));
        tr.appendChild(td2);

        var td3 = document.createElement("td");
        td3.appendChild(field("fld", a.teacher, "Who is teaching", function(v){ a.teacher = v; }));
        tr.appendChild(td3);

        tb.appendChild(tr);
      });
      tbl.appendChild(tb);
      body.appendChild(tbl);

      if(isSummerWed(t)){
        var box = el("div","seriesbox");
        box.innerHTML = "<b>Summer series</b>Wednesdays in Terms 3 and 4 run as one 13-week block. Put speakers in the week-by-week grid below.";
        body.appendChild(box);
      }

      /* notes */
      var nt = document.createElement("textarea");
      nt.className = "tnotes";
      nt.placeholder = "Term notes: conflicts, VBS, gospel meeting, flex weeks, who to ask.";
      nt.value = term(t).notes || "";
      nt.addEventListener("input", function(){ term(t).notes = nt.value; save(); });
      body.appendChild(nt);

      /* weeks */
      var det = document.createElement("details");
      det.className = "weeks";
      var sm = document.createElement("summary");
      sm.textContent = "Week by week · " + T.len + " Sundays, " + T.len + " Wednesdays";
      det.appendChild(sm);

      var built = false;
      det.addEventListener("toggle", function(){
        if(det.open && !built){ det.appendChild(weekGrid(t, T)); built = true; }
      });
      body.appendChild(det);

      card.appendChild(body);
      host.appendChild(card);
    });
  }

  function weekGrid(t, T){
    var wrap = document.createElement("div");

    ["sun","wed"].forEach(function(day){
      var cols = state.classes.filter(function(c){ return meets(c, day); });
      if(!cols.length) return;

      var lbl = el("p","daylabel", day === "sun" ? "Sundays" : "Wednesdays");
      wrap.appendChild(lbl);

      var sc = el("div","scroller");
      var tbl = el("table","wk");
      var thead = document.createElement("thead");
      var hr = document.createElement("tr");
      hr.appendChild(el("th",null,"Date"));
      cols.forEach(function(c){
        var th = el("th",null,c.name);
        th.setAttribute("data-name", c.id);
        hr.appendChild(th);
      });
      thead.appendChild(hr); tbl.appendChild(thead);

      var tb = document.createElement("tbody");
      T.weeks.forEach(function(W, wi){
        var tr = document.createElement("tr");
        var td0 = document.createElement("td");
        td0.appendChild(el("span","wdate", fmt(day === "sun" ? W.sun : W.wed)));
        td0.appendChild(document.createTextNode(" "));
        td0.appendChild(el("span","wnum","wk " + (wi+1)));
        tr.appendChild(td0);

        cols.forEach(function(c){
          var td = document.createElement("td");
          var key = day + ":" + c.id;
          td.appendChild(field("wfld", weekVal(t, wi, key), "", function(v){ setWeek(t, wi, key, v); }));
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      tbl.appendChild(tb);
      sc.appendChild(tbl);
      wrap.appendChild(sc);
    });

    return wrap;
  }

  /* ---------- toolbar ---------- */
  function wireToolbar(){
    var y = document.getElementById("year");
    y.value = state.year;
    y.addEventListener("change", function(){
      var v = parseInt(y.value, 10);
      if(isNaN(v) || v < 2024 || v > 2060){ y.value = state.year; return; }
      state.year = v; save(); renderView();
    });

    document.getElementById("btnAddClass").addEventListener("click", function(){
      state.classes.push({ id:"c" + (seq++), name:"New class", day:"both", group:"Youth" });
      save(); renderClasses(); renderView();
    });

    document.getElementById("btnByClass").addEventListener("click", function(){ state.view = "class"; save(); renderView(); });
    document.getElementById("btnByTerm").addEventListener("click", function(){ state.view = "term"; save(); renderView(); });

    document.getElementById("btnPrint").addEventListener("click", function(){ window.print(); });

    document.getElementById("btnExport").addEventListener("click", function(){
      var blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "bible-class-calendar-" + state.year + ".json";
      a.click();
      URL.revokeObjectURL(a.href);
      setStatus("Exported");
    });

    var fin = document.getElementById("fileIn");
    document.getElementById("btnImport").addEventListener("click", function(){ fin.click(); });
    fin.addEventListener("change", function(){
      var f = fin.files[0]; if(!f) return;
      var r = new FileReader();
      r.onload = function(){
        try{
          var s = JSON.parse(r.result);
          if(!s.classes || !s.year) throw new Error("bad file");
          state = s; save(); document.getElementById("year").value = state.year;
          renderClasses(); renderView(); setStatus("Imported");
        }catch(e){ alert("That file could not be read as a saved calendar."); }
      };
      r.readAsText(f);
      fin.value = "";
    });

    document.getElementById("btnReset").addEventListener("click", function(){
      if(!confirm("Clear everything and start over? Export first if you want a copy.")) return;
      var yr = state.year;
      state = defaultState(); state.year = yr;
      save(); renderClasses(); renderView(); setStatus("Reset");
    });
  }

  load(function(){
    if(!state.view) state.view = "class";
    wireToolbar();
    renderClasses();
    renderView();
    if(!(window.storage && window.storage.set)) setStatus("Export to keep");
  });
})();
</script>
</body>
</html>
